const CP=[
{n:2,short:'Basic Concepts',k:'#5b8dee',t:'Basic concepts in economics',test:'Test 1',sum:`Economics starts with <b>scarcity</b>: unlimited wants, limited resources. Everything else (goals, markets, government, policy) is a response to that problem.`,
S:[
['Scarcity and opportunity cost',
`Scarce resources, called <strong>economic means</strong>, are labour (earns wages), capital (interest), natural resources (rent) and entrepreneurship (profit). Because they are limited, every household, firm and government must choose.`,
['ex','Opportunity cost in practice',`You have R3 000: a second-hand laptop, or a semester of transport and textbooks. If you buy the laptop, your opportunity cost is the transport and textbooks, the <em>next best thing you gave up</em>. Trade-offs are measured by opportunity cost.`],
['warn','Trap in Activity 6',`“The best choice is the one with the highest opportunity cost” is <strong>false</strong>. A good choice is one where the benefit outweighs the opportunity cost.`]],
['The five macroeconomic goals (economic ends)',
['tbl',['Goal','Main indicator'],[['High, sustainable growth','Real GDP growth rate'],['Price stability','Inflation (CPI); SARB target 3–6%'],['High employment','Unemployment rate'],['Balance of payments stability','Current vs financial account, exchange rate'],['Equitable income distribution','Gini coefficient, Lorenz curve']]],
['ex','Spot the goal (Activity 14)',`“Cut unemployment from 27% to 23%” is the <strong>employment</strong> goal. “Keep inflation within the SARB range” is <strong>price stability</strong>. “Spend more on expanding manufacturing” is an <em>action</em> (a means), not a goal.`]],
['Economic objects and subjects',
['ul',[`<strong>Real assets</strong> are physical (machinery, buildings). <strong>Financial assets</strong> are claims: shares, bonds, savings accounts, unit trusts.`,`<strong>Subjects</strong>: households, firms, financial intermediaries, government (national, provincial, local, public enterprises) and the foreign sector.`]],
['ex','Is it a financial asset? (Activity 5)',`JSE shares, a government bond, an ABSA savings account and a unit trust are all <strong>yes</strong>. Production equipment bought on credit is <strong>no</strong>: the equipment is a real asset (the credit is a liability).`]],
['Markets, market failure and the mixed economy',
['ul',[`<strong>Free markets</strong>: product, factor, financial and foreign exchange markets.`,`<strong>Market failure</strong>: public goods, imperfect competition, externalities.`,`<strong>Mixed economy</strong>: government spends (exhaustive expenditure, transfers, subsidies), taxes (direct or indirect; progressive, proportional, regressive), runs a budget (surplus, deficit, debt trap) and sets policy.`,`<strong>Policy</strong>: fiscal (Treasury), monetary (SARB), balance of payments, wage and price. <em>Expansionary</em> stimulates; <em>restrictive</em> slows the economy down.`]],
['ex','Positive or normative?',`“Unemployment is above 30%” can be tested, so it is <strong>positive</strong>. “Government should create more jobs” is a value judgement, so it is <strong>normative</strong>.`]]],
Q:[['Name the four production factors and what each earns.',`Labour: wages. Capital: interest. Natural resources: rent. Entrepreneurship: profit.`],['“The minimum wage is too low.” Positive or normative?',`Normative: it contains a value judgement.`],['Why is a bank loan taken to buy a machine not a financial asset for the buyer?',`For the buyer it is a liability. The machine is the real asset.`]]},

{n:3,short:'Measuring Economy',k:'#0ea880',t:'Measuring the economy',test:'Test 1',sum:`Four things get measured: <b>prices</b> (inflation), <b>output</b> (GDP), <b>jobs</b> (unemployment) and <b>trade</b> (balance of payments). Know each formula and its worked example.`,
S:[
['Circular flow',
`Households sell factors to firms and receive income; firms sell goods to households and receive spending. Aggregate production = aggregate income = aggregate expenditure. <strong>Leakages</strong> (savings, taxes, imports) pull money out; <strong>injections</strong> (investment, government spending, exports) put it back.`],
['Inflation',
['f',`Inflation rate = (CPI new − CPI old) ÷ CPI old × 100\nReal value     = Nominal ÷ (1 + inflation rate)\nBase year = 100: Real value = Nominal ÷ CPI × 100`],
['ul',[`<strong>CPI</strong> tracks consumers’ cost of living (weighted basket: price × weight). <strong>PPI</strong> tracks firms’ production costs. <strong>Headline inflation</strong> is CPI-based.`,`<strong>Disinflation</strong>: inflation falls, but prices still rise, just slower. <strong>Deflation</strong>: the price level falls. <strong>Hyperinflation</strong>: money becomes worthless (over 1 000% a year in the slides).`,`<strong>Measurement problems</strong>: hundreds of products and shifting habits; an average hides group differences and quality changes; uses advertised prices, not discounts.`]],
['ex','Worked examples (CPI: 20X2 = 100, 20X3 = 106.2, 20X4 = 111.5)',`<strong>1.</strong> R20 000 stock held through 20X4. Inflation = (111.5 − 106.2) ÷ 106.2 = 5%. Real value = 20 000 ÷ 1.05 = <strong>R19 047.62</strong>.<br><strong>2.</strong> R40 000 held from the start of 20X2 to end of 20X4. Base is 100, so real value = 40 000 ÷ 1.115 = <strong>R35 874</strong>.<br><strong>3.</strong> R10 000 protected against inflation to 20X5, CPI forecast 116.9. Payout = 10 000 × 1.169 = <strong>R11 690</strong>.<br><strong>4.</strong> Salary R600 000 in 20X4. Real wage = 600 000 ÷ 1.05 = R571 428.57. Lost purchasing power = <strong>R28 571.43</strong>.`],
['tip',`Which year is the “old” CPI? Use the CPI at the <em>start</em> of the period you hold the asset. If it starts at 100, skip the inflation step and divide by the index.`]],
['GDP and economic growth',
['ul',[`<strong>GDP</strong> = value of final goods and services produced inside a country’s borders. <strong>Growth rate</strong> = % change in <em>real</em> GDP.`,`<strong>Expenditure method</strong>: C + I + G + (X − Z). <strong>Income method</strong>: remuneration of employees + gross operating surplus. <strong>Production method</strong>: add each sector’s value added.`,`<strong>Sectors</strong>: primary (agriculture, forestry, mining), secondary (manufacturing, construction), tertiary (services).`,`<strong>GDP per capita</strong> = real GDP ÷ population. <strong>GNP (GNI)</strong> = GDP − primary income paid to the rest of the world + primary income received from it.`]]],
['Unemployment',
['f',`Unemployment rate = unemployed ÷ labour force × 100\nParticipation rate = labour force ÷ working-age population × 100`],
['ex','Using SA numbers',`Slide data: labour force 18.4m out of 33.4m working-age people gives 18.4 ÷ 33.4 = <strong>55.1%</strong> participation. Illustration: if 5.9m of those 18.4m are jobless, the rate is 5.9 ÷ 18.4 = <strong>32.1%</strong>.`],
['tbl',['Type','Cause','Example'],[['Frictional','Between jobs','Graduate searching for a first role'],['Seasonal','Work only part of the year','Harvest or holiday-season workers'],['Cyclical','Business cycle downturn','Retrenchments in a recession'],['Structural','Lasting shift in labour demand','Automation replaces mine jobs']]]],
['Balance of payments and distribution',
['f',`Current account  = exports − imports (X > Z surplus, X < Z deficit)\nFinancial account = net portfolio investment + net FDI\nChange in reserves = current account + financial account`],
['ex','Illustration',`X = R900bn, Z = R850bn: current surplus <strong>R50bn</strong>. Net capital outflow of R30bn: financial account −R30bn. Reserves rise by <strong>R20bn</strong>.`],
`The <strong>Lorenz curve</strong> plots income distribution; the further it bows from the 45° equality line, the more unequal. The <strong>Gini coefficient</strong> runs from 0 (perfect equality) to 1 (perfect inequality).`]],
Q:[['Prices rose from CPI 100 to 108. What is the real value of R5 400 nominal?',`5 400 ÷ 1.08 = R5 000.`],['Is falling inflation the same as falling prices?',`No. Falling inflation is disinflation; prices still rise, slower. Falling prices is deflation.`],['Seasonal or structural: a ski-resort worker laid off each summer?',`Seasonal.`]]},

{n:5,short:'Business Cycle',k:'#9b6dff',t:'The business cycle',test:'Test 2',sum:`The economy moves through <b>recovery, boom, slump and recession</b>. Firms that plan for where the economy is <em>going</em> beat those that react to where it is.`,
S:[
['Why managers care',
`The economy determines roughly 16–53% of a firm’s profits (slides). Basil O’Hagan went from R100m to nothing in six months after borrowing to expand at the wrong time. Like the soccer rule: do not run to where the ball is, run to where it is going to be.`],
['The four phases',
['tbl',['Phase','What happens'],[['Recovery','Trough passed. Financial markets gain, confidence grows, consumers spend a bit more, firms stop cutting jobs.'],['Boom','Spending and inflation rise. Firms expand, hit capacity limits, invest more. Debt and imports rise. Financial markets stagnate.'],['Slump','Costs rise, profits fall. Expansion and hiring halted. Income and imports stabilise. Pessimism hits financial markets.'],['Recession','Spending falls, firms cut jobs, many go bankrupt. Negative growth, lower inflation or deflation. Debt and imports fall.']]],
`<strong>Turning points</strong>: the <em>peak</em> (boom to slump) and the <em>trough</em> (recession to recovery). The trend line is long-run growth.`],
['How policy responds',
`Counter-cyclical policy avoids big swings: <strong>stimulate</strong> in recession (negative growth, unemployment) and <strong>cool</strong> a boom (inflation, current account deficit).`,
['tbl',['Phase','Monetary policy','Fiscal policy'],[['Recovery','Low, stable rates','Tax revenue stabilises; spending rises to secure recovery'],['Boom','Higher rates to slow credit and spending','Revenue rises with incomes; extra spending not needed'],['Slump','Stable rates, cuts possible later','Revenue slows as incomes stagnate'],['Recession','Lower rates (deflation danger)','Revenue falls; government spends to stimulate']]]],
['Indicators: where are we?',
['ul',[`<strong>Leading</strong> indicator: where we are <em>going</em>.`,`<strong>Coincident</strong> indicator: where we <em>are</em>.`,`<strong>Lagging</strong> indicator: where we <em>were</em>.`]],
`All three come from the SARB. One indicator alone can mislead, so compare them.`],
['Business decisions across the cycle',
['ex','Typical reasoning (not stated in the slides)',`<strong>Finance</strong>: borrow long-term before rates rise in a boom; avoid fresh debt near the peak. <strong>Capex</strong>: costs fall in recession, so cheap to expand if cash allows. <strong>Pricing</strong>: raise prices ahead of inflation in a boom. <strong>Employment</strong>: train during slack periods. <strong>Cash flow</strong>: watch it hardest around the peak and slump when costs rise and profits fall.`],
['ul',[`The slides ask, per function (purchasing, employment, finance, capex, acquisitions, marketing, pricing): <em>where in the cycle do I increase or cut this?</em>`,`Most cycle-sensitive sectors: industrial metals, motor vehicles and parts, electronic and electrical equipment, travel and leisure.`]],
['tip',`Signals can be false. Do not try to time decisions exactly: <strong>better vaguely right than exactly wrong</strong>.`]]],
Q:[['Which phase has rising inflation, rising imports and firms at capacity?',`The boom.`],['What does the SARB do to rates in a boom, and why?',`Raises them to slow credit and spending and curb inflation.`],['Leading or lagging: an indicator that tells you where the economy was?',`Lagging.`]]},

{n:6,short:'Money & Interest',k:'#e8a020',t:'Money, interest rates and financial markets',test:'Test 2',sum:`Money is <b>created by bank lending</b>, and the SARB steers the economy by setting the <b>repo rate</b>, which works through a slow, multi-channel transmission mechanism.`,
S:[
['What money is and how it is counted',
`Money is what money does: a <strong>medium of exchange</strong>, a <strong>store of value</strong> and a <strong>unit of account</strong>. It evolved from IOUs and barter, to commodities (gold), notes and coins, cheques and e-money.`,
['tbl',['Measure','Covers'],[['M0','Notes and coins'],['M1a, M1, M2','Progressively more bank deposits'],['M3','All deposits (broadest)']]],
`Because all deposits count, <strong>credit is money</strong>.`],
['Money creation',
['f',`Money multiplier = 1 ÷ reserve requirement\nTotal deposits   = initial deposit × 1/RR`],
['ex','R100 and a 20% reserve requirement',`The bank keeps R20 and lends R80. That R80 is deposited, the bank keeps R16 and lends R64, and so on. Total deposits = 100 × 1/0.2 = <strong>R500</strong>.`],
`<strong>The real process</strong>: banks do not wait for deposits. Lerato wants a R30 000 student loan. If the bank thinks she is a good risk and has capital, it credits her account with R30 000, so the loan <em>creates</em> a deposit. It then needs reserves of 10% (R3 000), found or borrowed from the SARB. Banks lend only if there is <strong>demand</strong>, the loan looks <strong>profitable</strong> and they have enough <strong>capital</strong>.`,
['tip',`Bank capital = assets − liabilities. It is the buffer that absorbs losses when loans default.`]],
['The market for credit and the repo rate',
['ul',[`<strong>Demand for credit</strong> slopes down because borrowing has an opportunity cost. Higher income shifts it right (more credit).`,`<strong>Repo rate</strong> up means prime rate up, credit dearer, quantity of credit falls (a <em>movement along</em> the demand curve).`,`The SARB makes the repo rate bite by keeping banks short of reserves, using open-market operations, quantitative easing or tapering, and reserve requirements.`]]],
['Transmission and inflation targeting',
`Repo rate changes ripple through prime rate, money and credit, asset prices, the rand, and inflation expectations. They affect aggregate demand, import prices, wages and production costs, and finally CPI, but it takes <strong>12–24 months</strong>. So the SARB targets forecast inflation about two years ahead, not today’s. The target band is <strong>3–6%</strong>.`,
['ul',[`<strong>Independence</strong> builds credibility: goal independence (sets own target) vs instrumental independence (chooses how to reach it). Credibility anchors inflation expectations.`,`The system runs on faith: the SARB protects the rand’s buying power, regulates banks, avoids bank runs and uses moral suasion.`]]],
['Yield curve',
`A <strong>yield</strong> is the rate of return on a financial asset. Assets differ by <strong>maturity</strong> (how long until repaid). The repo rate is short-term, so it mainly moves short-term rates.`,
['ex','Reading the curve (Lemuria)',`90-day T-bill 5%, 5-year bond 7%, 10-year bond 8%. Yield rises with maturity: an <strong>upward-sloping</strong> (normal) curve. A R1m bond with a 10% coupon pays R100 000 interest a year until it matures.`]]],
Q:[['A R200 deposit, 10% reserve requirement. Maximum total deposits?',`200 × 1/0.1 = R2 000.`],['Name the three limits on a bank’s lending.',`Demand for loans, expected profitability, enough capital.`],['Why does the SARB target inflation 24 months ahead?',`Rate changes take 12–24 months to work through the transmission mechanism.`]]},

{n:8,short:'Government',k:'#e05a5a',t:'Role of government',test:'Test 2',sum:`Government fixes market failure and spreads income more fairly through <b>allocation, distribution and stabilisation</b>, funded by tax and borrowing.`,
S:[
['The three functions',
['tbl',['Function','Problem','Tools'],[['Allocation','Monopoly (high prices, low output), externalities, collective goods the market cannot provide (free-rider problem)','Anti-monopoly measures, regulation, direct provision'],['Distribution','Markets follow money demand, not need','Progressive tax, transfers (aged, disabled, unemployed), food and health subsidies'],['Stabilisation','Booms and slumps','Fiscal and monetary measures']]],
`Judge any intervention on <strong>efficiency, effectiveness, equity and sustainability</strong>. The NDP aims to build a capable developmental state.`],
['Government spending',
['ul',[`<strong>Final consumption</strong>: non-capital items such as public servant salaries.`,`<strong>Transfer payments</strong>: social grants.`,`<strong>Capital expenditure</strong>: economic and social infrastructure.`,`Treasury’s fiscal goals: <strong>equity</strong>, <strong>funding</strong> spending without a harmful debt burden, and <strong>macro stability</strong>.`]]],
['Taxation',
['tbl',['Type','Rule','SA example','Effect on inequality'],[['Progressive','Rate rises with income','PAYE','Reduces it'],['Proportional','Same rate','Company tax','Unchanged'],['Regressive','Share of income falls as income rises','VAT','Worsens it']]],
['ex','Why VAT is regressive',`R1 000 of groceries carries R150 VAT. On a R5 000 income that is <strong>3%</strong>; on R50 000 it is <strong>0.3%</strong>.`],
['ul',[`<strong>Principles</strong>: efficiency (avoid distortions and deadweight loss), equity (benefit received, ability to pay, horizontal and vertical equity), transparency and certainty.`,`<strong>Laffer curve</strong>: revenue rises with tax rates, at a diminishing rate, up to T*. Beyond T* higher rates <em>reduce</em> revenue.`,`Taxes change <strong>work incentives, demand patterns and productivity</strong>.`,`<strong>SA</strong>: personal income tax is the biggest source; VAT now exceeds company tax; borrowing funds capital spending.`]],
`<strong>Privatisation</strong> sells state functions; <strong>deregulation</strong> removes rules to strengthen the private sector.`],
['The budget and deficit financing',
`The budget is the plan for the year’s revenue and spending and gives government legal authority to tax and spend. A <strong>deficit</strong> is spending above revenue; a <strong>surplus</strong> is the reverse.`,
['tbl',['Financing a deficit','Chain of effects'],[['Borrow from non-bank private sector','Money demand ↑, interest rates ↑, private investment ↓ (<strong>crowding out</strong>)'],['Borrow from the central bank','Money supply ↑, rates ↓, C and I ↑; <strong>inflationary</strong>'],['Foreign loans','Inflow raises money supply, rates ↓, expansionary']]],
['ul',[`<strong>Automatic stabilisers</strong>: in a recession unemployment benefits rise and tax revenue falls, so the deficit widens on its own. Discretionary changes face time lags and can destabilise.`,`<strong>Debt</strong>: watch the deficit and debt as a % of GDP (debt-GDP ratio). Large debt means a heavy interest bill, a transfer to wealthier bondholders, fiscal instability and a burden on future generations.`]]]],
Q:[['Which tax type worsens inequality, and why?',`Regressive (VAT): lower earners pay a bigger share of income.`],['What happens to revenue past T* on the Laffer curve?',`It falls as higher rates discourage work and activity.`],['Why is borrowing from the central bank inflationary?',`It raises the money supply and banks’ ability to create more money.`]]},

{n:9,short:'Expenditure Model',k:'#38bdf8',t:'Total expenditure model',test:'Test 3',sum:`Income settles where <b>planned spending equals output</b>. Add sectors one at a time: C, then I, then G and taxes, then net exports. Master the multiplier.`,
S:[
['Household sector: C and S',
['f',`Yd = C + S\nC  = a + MPC × Yd        (a = autonomous consumption)\nS  = −a + MPS × Yd       MPS = 1 − MPC`],
['ul',[`<strong>Keynes’ law</strong>: when income rises, consumption rises, but by less.`,`<strong>Autonomous</strong> C is spent even at zero income (by dissaving or borrowing); <strong>induced</strong> C is caused by income.`,`MPC = ΔC ÷ ΔYd. APC = C ÷ Yd. Same idea for MPS and APS.`]],
['ex','Numbers',`a = 100, MPC = 0.8. At Yd = 1 000: C = 100 + 0.8 × 1 000 = <strong>900</strong>, and S = −100 + 0.2 × 1 000 = <strong>100</strong>. Break-even (C = Yd, S = 0) is at Yd = 500.`],
['tip',`<strong>Move along</strong> the C curve only when Yd changes. <strong>Shift</strong> the curve for anything else (wealth, expectations, autonomous C).`]],
['Capital formation (I) and the two-sector model',
`Planned I (machines, change in inventories) falls when the interest rate rises (higher cost, higher opportunity cost). A change in <em>r</em> is a move along the I curve; taxes, conditions or expectations shift it. I is treated as <strong>autonomous</strong>, independent of income.`,
['f',`AD = C + I = a + I + MPC × Y\nEquilibrium: Y = AD, and S = I\nYe = autonomous AD × multiplier\nMultiplier = 1 ÷ (1 − MPC)`],
['ex','Finding Ye',`a = 100, I = 150, MPC = 0.8. Autonomous AD = 250. Multiplier = 1 ÷ 0.2 = 5. Ye = 250 × 5 = <strong>1 250</strong>. Check: S = −100 + 0.2 × 1 250 = 150 = I ✓. An extra R150 of I raised income by R750.`],
`<strong>Adjustment</strong>: if AD &gt; Y, stock runs down and firms produce more. If AD &lt; Y, unsold stock builds and firms produce less. Both push income toward Ye.`],
['Adding government and tax',
`G is autonomous, so it shifts AD up. A tax rate t reduces disposable income, so MPC is replaced by <strong>MPC × (1 − t)</strong>, which swivels (flattens) the curve and shrinks the multiplier.`,
['f',`Multiplier (with tax) = 1 ÷ [1 − MPC(1 − t)]`],
['ex','G = 350 and t = 25%',`MPC(1 − t) = 0.8 × 0.75 = 0.6. Multiplier = 1 ÷ 0.4 = <strong>2.5</strong>. Autonomous AD = 100 + 150 + 350 = 600. Ye = 600 × 2.5 = <strong>1 500</strong>. Without tax the multiplier would have been 5.`]],
['Adding the foreign sector',
`Net exports (X − Z) are autonomous: positive NX shifts AD <em>up</em>, negative shifts it <em>down</em>, zero changes nothing. MPC and t are unchanged, so the <strong>multiplier stays the same</strong>.`,
['ex','X = 200, Z = 100',`NX = +100, autonomous AD = 700, Ye = 700 × 2.5 = <strong>1 750</strong>.`]],
['Exam-style calculation',
['ex','Full question',`Autonomous C = 50, G = 20, I = 30, X = 40, Z = 60. MPC = 0.6, t = 30%.<br><strong>1.</strong> Autonomous AD = 50 + 20 + 30 + (40 − 60) = 80.<br><strong>2.</strong> Multiplier = 1 ÷ [1 − 0.6(0.7)] = 1 ÷ 0.58 = 1.72.<br><strong>3.</strong> Ye = 80 × 1.72 = <strong>138</strong>.<br><strong>4.</strong> If G rises by 10: ΔYe = 10 × 1.72 = <strong>17.2</strong>.`],
['warn','Common slip',`Do not forget (1 − t) in the multiplier once a tax rate is given, and remember net exports can be <em>negative</em>.`]]],
Q:[['MPC = 0.75, no tax. What is the multiplier?',`1 ÷ 0.25 = 4.`],['MPC = 0.9, t = 20%. Multiplier?',`1 ÷ [1 − 0.9 × 0.8] = 1 ÷ 0.28 ≈ 3.57.`],['Does the foreign sector change the multiplier?',`No, only a shift in AD (when NX is autonomous).`]]},

{n:10,short:'AD-AS & Policy',k:'#f472b6',t:'Policy interaction and the AD-AS model',test:'Test 3 and exam',sum:`Monetary and fiscal policy reach the real economy through <b>interest rates, investment and the exchange rate</b>. The AD-AS model then shows the effect on <b>prices and output</b>.`,
S:[
['Keynesian transmission mechanism',
['f',`Expansionary monetary: Ms ↑ → i ↓ → I ↑ → AD ↑ → Y ↑ → jobs ↑`],
`So yes, a repo rate change <em>can</em> affect unemployment, but indirectly. The <strong>interest rate elasticity of investment</strong> links the monetary and real sectors: the more investment reacts to rates, the stronger the effect.`,
['ex','Does infrastructure spending change interest rates?',`If government <strong>borrows from the private sector</strong>, money demand ↑, i ↑, private I ↓. That is <strong>financial crowding-out</strong>. Borrowing from the central bank or abroad instead raises money supply and lowers rates, with inflationary consequences.`]],
['The open economy',
['tbl',['Variable','Depends on','Sign'],[['Imports (M)','SA income','Positive'],['','SA prices ÷ foreign prices','Positive'],['','Exchange rate (rand strength)','Positive'],['Exports (X)','Foreign income','Positive'],['','SA prices ÷ foreign prices','Negative'],['','Exchange rate','Negative'],['Capital inflow','Interest rate differential, relative returns','Positive'],['','Exchange rate','Negative']]],
`Tariffs, quotas, sanctions and WTO rules also affect imports. Political certainty and expectations drive capital flows.`],
['Balance of payments and the BP curve',
['f',`BoP = current account + financial account\nSurplus → reserves build; deficit → reserves fall`],
['ul',[`The <strong>BP curve</strong> shows combinations of interest rate and income where BoP balances. It slopes <strong>up</strong>: higher income raises imports (deficit), so a higher rate must attract capital to compensate.`,`Anything that improves the BoP (other than Y and i) shifts the curve <strong>right</strong>; anything that weakens it shifts it left.`,`<strong>Exchange rate</strong>: BoP surplus means excess demand for rand, so the rand appreciates (exports ↓, imports ↑). A deficit means depreciation (exports ↑, imports ↓), which self-corrects.`,`<strong>Consequences of imbalance</strong>: foreign reserves (aim to cover three months of imports; low reserves push rates up), money supply (a surplus raises M1) and the exchange rate.`]]],
['Unintended effects of policy on the BoP',
['ex','Expansionary monetary policy',`<strong>Part 1</strong>: Ms ↑, i ↓. Capital flows out (financial deficit). Also I ↑, Y ↑, imports ↑ (current deficit). BoP deficit.<br><strong>Part 2</strong>: outflow shrinks Ms, i ↑, I ↓, Y ↓, imports ↓ (automatic stabiliser). Rand depreciates, X ↑, Z ↓, so BoP moves back toward zero.`],
['ex','Expansionary fiscal policy',`G ↑ or tax ↓ raises Y and imports (current deficit), but money demand and i ↑ attract capital (financial surplus). The first effect is normally bigger, so a BoP deficit follows. Then the same correction as above.`]],
['AD-AS: aggregate demand',
`AD = C + I + G + (X − Z), negatively related to the price level. <strong>Why it slopes down</strong>: real balance effect, real wealth effect, interest rate effect, net export effect. A price change is a <em>move along</em> AD.`,
['ul',[`<strong>Shifts right</strong>: expansionary fiscal or monetary policy, higher confidence, stronger foreign demand or rand depreciation, more wealth or population.`,`<strong>Shifts left</strong>: contractionary policy (Ms ↓, i ↑, I ↓), weaker confidence, trade barriers, global slowdown.`]]],
['AD-AS: aggregate supply',
['ul',[`<strong>Long run</strong>: wages and prices are flexible, so the economy returns to full-employment output (YF). LRAS is <strong>vertical</strong>.`,`<strong>Short run</strong>: nominal wages are sticky (annual negotiations; COSATU will rarely accept a cut), so SRAS slopes <strong>up</strong>. Rising output needs more costly labour and lower-quality inputs.`,`<strong>SRAS shifts right</strong>: lower company tax, bigger or better-skilled workforce, lower input costs, new technology, optimism.`]]],
['Short-run and long-run adjustment',
['ex','Expansionary monetary policy (AD shifts right)',`<strong>Short run (A to B)</strong>: P ↑, real wage (w ÷ P) ↓, labour is cheaper, firms use overtime, so Y rises <strong>above</strong> YF.<br><strong>Long run (B to C)</strong>: labour demand pushes wages up, costs rise, SRAS shifts left, P rises again and Y falls back to YF. Result: <strong>higher prices, same output</strong>.`],
['warn','Supply shock',`A fall in AS (SRAS left) raises P and lowers Y at once: output falls <em>and</em> prices rise (stagflation).`]]],
Q:[['Why does the BP curve slope upward?',`Higher income lifts imports, so a higher interest rate is needed to attract capital and keep BoP balanced.`],['Why can Y exceed YF in the short run but not the long run?',`Sticky nominal wages let firms overuse labour; once wages catch up, SRAS shifts left and output returns to YF.`],['Fiscal expansion financed by private borrowing: effect on private investment?',`It falls: crowding-out through higher interest rates.`]]}
];

let cpCur=0,cpDone=[];const cpKey=()=>'sh:'+MOD.id+':done';
function cpLoad(){try{let v=localStorage.getItem(cpKey());if(v===null&&MOD.id==='mne7xb1')v=localStorage.getItem('mne-cp-done');cpDone=JSON.parse(v||'[]')}catch(e){cpDone=[]}}
function cpSave(){try{localStorage.setItem(cpKey(),JSON.stringify(cpDone))}catch(e){}}
function cpItem(x){
  if(typeof x==='string')return `<p>${x}</p>`;
  const t=x[0];
  if(t==='ul')return `<ul>${x[1].map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(t==='f')return `<div class="cp-f">${x[1]}</div>`;
  if(t==='tbl')return `<div class="cp-tw"><table><thead><tr>${x[1].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${x[2].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(t==='ex')return `<div class="cp-co"><b>${x[1]}</b>${x[2]}</div>`;
  if(t==='tip')return `<div class="cp-co tip"><b>Exam tip</b>${x[1]}</div>`;
  if(t==='warn')return `<div class="cp-co warn"><b>${x[1]}</b>${x[2]}</div>`;
  return '';
}
function cpRender(i,scroll){
  cpCur=i;try{localStorage.setItem('sh:'+MOD.id+':ch',i)}catch(e){}const c=MOD.chapters[i],done=cpDone.includes(c.n);
  const root=document.getElementById('cpRoot');
  root.style.setProperty('--k',c.k);
  document.getElementById('cpSide').innerHTML=`<h2>Chapters</h2><div class="cp-count">${cpDone.length} of ${MOD.chapters.length} complete</div>`+MOD.chapters.map((x,j)=>`<button class="cp-li${cpDone.includes(x.n)?' done':''}" style="--k:${x.k}" aria-current="${j===i}" onclick="cpRender(${j},true)"><span class="cp-dot">${cpDone.includes(x.n)?'✓':x.n}</span>${x.t}</button>`).join('');
  document.getElementById('cpBar').style.cssText=`width:${cpDone.length/MOD.chapters.length*100}%;background:${c.k}`;
  const jump=c.S.map((s,j)=>`<a href="#cp-s${j}" onclick="event.preventDefault();document.getElementById('cp-s${j}').scrollIntoView({behavior:'smooth'})">${s[0]}</a>`).join('');
  const body=c.S.map((s,j)=>`<h3 id="cp-s${j}">${s[0]}</h3>`+s.slice(1).map(cpItem).join('')).join('');
  const qs=c.Q.map(q=>`<details class="cp-q"><summary>${q[0]}</summary><div>${q[1]}</div></details>`).join('');
  document.getElementById('cpArt').innerHTML=`<div class="cp-meta">Chapter ${c.n}${c.test?` · Assessed in ${c.test}`:''}</div><h1 class="cp-h1">${c.t}</h1><div class="cp-sum"><b>In short:</b> ${c.sum}</div><nav class="cp-jump" aria-label="In this chapter">${jump}</nav>${body}<h3 id="cp-q">Check yourself</h3><p>Try answering before you open each one.</p>${qs}<div class="cp-nav"><button class="cp-b" ${i===0?'disabled':''} onclick="cpRender(${i-1},true)">← Previous</button><button class="cp-b main${done?' on':''}" onclick="cpToggle()">${done?'✓ Completed (undo)':'Mark chapter complete'}</button><button class="cp-b" ${i===MOD.chapters.length-1?'disabled':''} onclick="cpRender(${i+1},true)">Next →</button></div>`;
  if(scroll)window.scrollTo(0,0);
}
function cpToggle(){const n=MOD.chapters[cpCur].n,p=cpDone.indexOf(n);p<0?cpDone.push(n):cpDone.splice(p,1);cpSave();cpRender(cpCur,false)}
function cpInit(){if(!document.getElementById('cpArt').innerHTML){cpLoad();let i=0;try{i=Math.min(+localStorage.getItem('sh:'+MOD.id+':ch')||0,MOD.chapters.length-1)}catch(e){}cpRender(i,false)}}

const CHEAT={"2": "<div class=\"ch-label\">Chapter 2 — Basic Concepts in Economics<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 2<\/span>\n    <h4>5 Macroeconomic Goals<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>High & sustainable economic growth<\/strong> — real GDP growth rate<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Price stability<\/strong> — low inflation, CPI within target (3–6% SA)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>High employment<\/strong> — low unemployment rate<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span><strong>Balance of payments stability<\/strong> — exports, foreign currency, exchange rate<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">5<\/span><span><strong>Equitable distribution of income<\/strong> — Gini coefficient, Lorenz curve<\/span><\/div>\n    <div class=\"chip\">Economic means: Labour + Capital + Natural resources + Entrepreneurs (remunerated by wages, rent, interest, profit)<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 2<\/span>\n    <h4>Types of Markets<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Product market<\/strong> — goods & services bought/sold<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Factor market<\/strong> — labour, capital, land<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Financial market<\/strong> — bonds, shares, savings<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span><strong>Foreign exchange market<\/strong> — currency trading<\/span><\/div>\n    <div class=\"chip\">Market failure: public goods, imperfect competition, externalities<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 2<\/span>\n    <h4>Types of Policy<\/h4>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span><strong>Fiscal policy<\/strong> — government spending & taxation (National Treasury)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span><strong>Monetary policy<\/strong> — money supply & interest rates (SARB)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span><strong>Trade policy<\/strong> — tariffs, quotas, exchange rates<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span><strong>Wage & price policy<\/strong> — direct controls<\/span><\/div>\n    <div class=\"chip\">Expansionary policy = stimulate economy | Restrictive policy = slow it down<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 2<\/span>\n    <h4>Progressive vs Regressive Tax<\/h4>\n    <div class=\"row\"><span class=\"rn\">P<\/span><span><strong>Progressive<\/strong> (PAYE): rate increases as income increases → more equitable<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">P<\/span><span><strong>Proportional<\/strong> (Company tax): rate stays constant<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">R<\/span><span><strong>Regressive<\/strong> (VAT): lower-income earners pay higher % of income → worsens inequality<\/span><\/div>\n  <\/div>\n<\/div>", "3": "<div class=\"ch-label\">Chapter 3 — Measuring the Economy<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 3<\/span>\n    <h4>Inflation — Key Terms<\/h4>\n    <div class=\"row\"><span class=\"rn\">CPI<\/span><span>Consumer Price Index — measures changes in cost of living basket<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">PPI<\/span><span>Producer Price Index — measures firms' cost of production<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">DI<\/span><span><strong>Disinflation<\/strong> — inflation rate falls (prices still rising, just slower)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">HI<\/span><span><strong>Hyperinflation<\/strong> — >1000% p.a., money becomes worthless<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">DE<\/span><span><strong>Deflation<\/strong> — persistent FALL in general price level (negative inflation)<\/span><\/div>\n    <div class=\"chip\">Inflation rate = (New CPI − Old CPI) ÷ Old CPI × 100<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 3<\/span>\n    <h4>Real vs Nominal Values<\/h4>\n    <div class=\"bf\" style=\"margin:0;padding:10px 12px\">\n      <div class=\"bff\" style=\"font-size:0.72rem\">Inflation rate = (New CPI − Old CPI) ÷ Old CPI × 100<br>Real value = Nominal ÷ (1 + inflation rate)<br>Real value = Nominal ÷ CPI × 100 (when base=100)<\/div>\n    <\/div>\n    <div class=\"chip\">Nominal = rand value. Real = adjusted for inflation = purchasing power<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 3<\/span>\n    <h4>GDP — 3 Measurement Methods<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Expenditure:<\/strong> C + I + G + (X − Z)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Income:<\/strong> Remuneration + Gross operating surplus<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Production:<\/strong> Value-added by each sector<\/span><\/div>\n    <div class=\"chip\">GDP = value of FINAL goods & services within SA borders. Growth rate = % change in real GDP year-to-year.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 3<\/span>\n    <h4>Circular Flow — Leakages & Injections<\/h4>\n    <div class=\"row\"><span class=\"rn\" style=\"color:var(--warn)\">L<\/span><span><strong>Leakages:<\/strong> Savings (S), Taxes (T), Imports (Z) — money leaving circular flow<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\" style=\"color:var(--green)\">I<\/span><span><strong>Injections:<\/strong> Investment (I), Government spending (G), Exports (X) — money entering<\/span><\/div>\n    <div class=\"chip\">Equilibrium: Leakages = Injections | Aggregate production = income = expenditure<\/div>\n  <\/div>\n<\/div>", "5": "<div class=\"ch-label\">Chapter 5 — Business Cycle<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 5<\/span>\n    <h4>4 Phases of the Business Cycle<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Recovery<\/strong> — financial markets gain, confidence grows, employment stabilises<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Boom<\/strong> — C rises with inflation, firms expand & invest, debt & imports rise, financial markets stagnate<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Slump<\/strong> — costs rise, profits fall, employment & expansion halted, financial market losses<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span><strong>Recession<\/strong> — income, spending & imports fall sharply, unemployment rises<\/span><\/div>\n    <div class=\"chip\">Turning points: Peak (boom → slump) | Trough (recession → recovery)<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 5<\/span>\n    <h4>Firm Strategy by Phase<\/h4>\n    <div class=\"row\"><span class=\"rn\">R<\/span><span><strong>Recovery:<\/strong> Start hiring, increase production, begin capital expenditure<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">B<\/span><span><strong>Boom:<\/strong> Maximise production, raise prices, expand market share<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">S<\/span><span><strong>Slump:<\/strong> Cut costs, reduce inventory, halt expansion<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">R<\/span><span><strong>Recession:<\/strong> Cut jobs, reduce debt, preserve cash<\/span><\/div>\n    <div class=\"chip\">\"Don't plan based on where the economy IS — plan for where it's GOING to be\"<\/div>\n  <\/div>\n<\/div>", "6": "<div class=\"ch-label\">Chapter 6 — Money, Interest Rates & Financial Markets<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 6<\/span>\n    <h4>Functions of Money<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Medium of exchange<\/strong> — used to buy/sell<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Store of value<\/strong> — hold wealth over time<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Unit of account<\/strong> — measure prices<\/span><\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 6<\/span>\n    <h4>Money Definitions (M0→M3)<\/h4>\n    <div class=\"row\"><span class=\"rn\">M0<\/span><span>Notes and coins only (physical cash)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">M1<\/span><span>M0 + demand deposits (current accounts)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">M2<\/span><span>M1 + short-term savings deposits<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">M3<\/span><span>ALL deposits — broadest definition<\/span><\/div>\n    <div class=\"chip\">Money multiplier = 1 ÷ Reserve Requirement. eg: 20% RR → multiplier = 5. R100 deposit → R500 total money created.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 6<\/span>\n    <h4>Demand for Money — 3 Motives<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Transactions motive<\/strong> — hold cash for day-to-day spending<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Precautionary motive<\/strong> — hold cash for unexpected events<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Speculative motive<\/strong> — hold cash to take advantage of investment opportunities<\/span><\/div>\n    <div class=\"chip\">1+2 = Active balances (vary with income). 3 = Passive balances (vary with interest rates).<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 6<\/span>\n    <h4>Monetary Policy — SARB Tools<\/h4>\n    <div class=\"row\"><span class=\"rn\">R<\/span><span><strong>Repo rate<\/strong> — rate at which SARB lends to banks. Raise = restrict. Lower = expand.<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">O<\/span><span><strong>Open market operations<\/strong> — buy/sell government bonds to change money supply<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">Q<\/span><span><strong>Quantitative easing<\/strong> — large-scale asset purchases to inject money<\/span><\/div>\n    <div class=\"chip\">SARB target: inflation 3–6%. Repo rate ↑ → prime rate ↑ → borrowing costs ↑ → spending ↓ → inflation ↓<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 6<\/span>\n    <h4>Money Market Graph<\/h4>\n    <div class=\"row\"><span class=\"rn\">Y<\/span><span>Vertical axis = Interest rate (i)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">X<\/span><span>Horizontal axis = Quantity of money (M)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">Md<\/span><span>Demand curve — NEGATIVE slope (higher i → less demand for money)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">Ms<\/span><span>Supply curve — VERTICAL (supply fixed by SARB, not affected by i)<\/span><\/div>\n    <div class=\"chip\">Equilibrium where Md meets Ms → equilibrium interest rate<\/div>\n  <\/div>\n<\/div>", "8": "<div class=\"ch-label\">Chapter 8 — Role of Government<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 8<\/span>\n    <h4>3 Functions of Government<\/h4>\n    <div class=\"row\"><span class=\"rn\">A<\/span><span><strong>Allocation<\/strong> — correct market failures (monopolies, externalities, public goods)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">D<\/span><span><strong>Distribution<\/strong> — make income distribution more equitable (progressive tax, transfers, subsidies)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">S<\/span><span><strong>Stabilisation<\/strong> — smooth business cycles using monetary & fiscal policy<\/span><\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 8<\/span>\n    <h4>Financing a Budget Deficit<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Domestic borrowing<\/strong> (non-bank private sector) — issue Treasury Bills/bonds → higher interest rates → crowds out private investment<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Borrow from SARB<\/strong> — sells bonds to SARB → increases money supply → inflationary → lower interest rates<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Foreign loans<\/strong> — borrow on foreign markets → inflow of foreign money → increases money supply<\/span><\/div>\n    <div class=\"chip\">Crowding out: government borrowing → higher i → less private investment (I↓)<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 8<\/span>\n    <h4>4 Principles of Taxation<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Efficiency<\/strong> — minimise harmful distortions (avoid dead weight loss)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Equity<\/strong> — fair, based on ability to pay; horizontal & vertical equity<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Transparency & certainty<\/strong> — people can plan their tax affairs<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span><strong>Simplicity<\/strong> — difficult to evade, not expensive to collect<\/span><\/div>\n    <div class=\"chip\">Laffer Curve: tax revenue rises then falls as tax rate increases. T* = optimal tax rate.<\/div>\n  <\/div>\n<\/div>", "9": "<div class=\"ch-label\">Chapter 9 — Total Expenditure Model (Keynesian)<\/div>\n<div class=\"bf\">\n  <div class=\"bf-l\">Keynesian Model — Key Formulas<\/div>\n  <div class=\"bff\">\nC <span class=\"dim\">=<\/span> <span class=\"hi\">Autonomous C + MPC × Yd<\/span>   <span class=\"dim\">(eg: C = 100 + 0.8Yd)<\/span>\nS <span class=\"dim\">=<\/span> <span class=\"hi\">−Autonomous C + MPS × Yd<\/span>   <span class=\"dim\">(eg: S = −100 + 0.2Yd)<\/span>\nMPC + MPS <span class=\"dim\">=<\/span> 1   <span class=\"dim\">|   Yd = C + S<\/span>\nMultiplier <span class=\"dim\">=<\/span> <span class=\"hi\">1 ÷ (1 − MPC)<\/span>   <span class=\"dim\">no tax (eg: 1÷0.2 = 5)<\/span>\nMultiplier <span class=\"dim\">=<\/span> <span class=\"hi\">1 ÷ (1 − MPC(1−t))<\/span>   <span class=\"dim\">with tax (eg: 1÷0.4 = 2.5)<\/span>\nYe <span class=\"dim\">=<\/span> <span class=\"hi\">Multiplier × Autonomous Spending<\/span>\nAutonomous spending <span class=\"dim\">=<\/span> Auto C + I + G + (X − Z)\n  <\/div>\n<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 9<\/span>\n    <h4>MPC & MPS<\/h4>\n    <div class=\"row\"><span class=\"rn\">MPC<\/span><span>Marginal Propensity to Consume — fraction of extra R1 of income spent on C. eg: R80 out of R100 = 0.8<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">MPS<\/span><span>Marginal Propensity to Save — fraction saved. eg: R20 out of R100 = 0.2<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">=<\/span><span>MPC + MPS = 1 always<\/span><\/div>\n    <div class=\"chip\">Higher MPC → steeper C-curve → larger multiplier effect<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 9<\/span>\n    <h4>The Multiplier — How It Works<\/h4>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>Invest R150 → someone earns R150 income<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>They spend 80% (R120) → someone else earns R120<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>They spend 80% (R96) → and so on...<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">=<\/span><span>Final ΔY = R150 × 5 = R750 total<\/span><\/div>\n    <div class=\"chip\">Tax reduces the multiplier. More tax → flatter AD curve → smaller ΔY from same injection.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 9<\/span>\n    <h4>Building the Model (3 Steps)<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>2-sector:<\/strong> Y = C + I. Multiplier = 1/(1−MPC)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>3-sector:<\/strong> Y = C + I + G. Add tax → multiplier = 1/(1−MPC(1−t))<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>4-sector (open):<\/strong> Y = C + I + G + (X−Z). X>Z → AD curve shifts up. X&lt;Z → shifts down.<\/span><\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 9<\/span>\n    <h4>Capital Formation (Investment I)<\/h4>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>I = fixed capital formation + changes in inventories<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>Higher interest rate → higher cost of borrowing → less I<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">→<\/span><span>I is AUTONOMOUS — independent of Y (horizontal line on I-Y graph)<\/span><\/div>\n    <div class=\"chip\">I-curve shifts when: taxation changes, economic conditions change, political expectations shift<\/div>\n  <\/div>\n<\/div>", "10": "<div class=\"ch-label\">Chapter 10 — Policy Interaction & AD-AS Model<\/div>\n<div class=\"cram-grid\">\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>Keynesian Transmission Mechanism<\/h4>\n    <div class=\"row\"><span class=\"rn\">M<\/span><span><strong>Monetary:<\/strong> SARB repo ↓ → i ↓ → I ↑ → Y ↑ → employment ↑<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">F<\/span><span><strong>Fiscal:<\/strong> G ↑ or T ↓ → Yd ↑ → C ↑ → Y ↑ (via multiplier)<\/span><\/div>\n    <div class=\"chip\">Crowding out: G ↑ → demand for money ↑ → i ↑ → I ↓. Government spending crowds out private investment.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>AD Curve — Why It Slopes Down<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span><strong>Real balance effect<\/strong> — higher P → lower purchasing power<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span><strong>Real wealth effect<\/strong> — higher P → people feel less wealthy → spend less<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span><strong>Interest rate effect<\/strong> — higher P → higher i → less I<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span><strong>Net export effect<\/strong> — higher P → SA goods more expensive → X ↓, Z ↑<\/span><\/div>\n    <div class=\"chip\">AD shifts RIGHT: expansionary monetary/fiscal policy, positive expectations, higher foreign income, population growth<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>AS Curves — Short Run vs Long Run<\/h4>\n    <div class=\"row\"><span class=\"rn\">LR<\/span><span><strong>LRAS:<\/strong> Vertical at YF (full employment). Wages & prices fully flexible. Economy always returns to YF.<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">SR<\/span><span><strong>SRAS:<\/strong> Positive slope. Nominal wages are STICKY (don't adjust quickly). Y can deviate from YF.<\/span><\/div>\n    <div class=\"chip\">SRAS shifts right: lower input costs, better technology, more labour supply, favourable policy. SRAS shifts left: supply shocks (oil prices), higher wages.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>AD-AS Adjustment — Expansionary Monetary Policy<\/h4>\n    <div class=\"row\"><span class=\"rn\">SR<\/span><span>Ms ↑ → i ↓ → I ↑ → AD shifts right → P ↑ and Y ↑ above YF<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">LR<\/span><span>Higher P → workers demand higher wages → costs ↑ → SRAS shifts left → Y returns to YF but P higher<\/span><\/div>\n    <div class=\"chip\">Long-run result of expansionary policy: higher price level but same output (YF). Inflation with no lasting growth benefit.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>BOP & Exchange Rate<\/h4>\n    <div class=\"row\"><span class=\"rn\">+<\/span><span>BOP surplus → excess demand for Rand → Rand <strong>appreciates<\/strong><\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">−<\/span><span>BOP deficit → excess supply of Rand → Rand <strong>depreciates<\/strong><\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">D<\/span><span>Rand depreciates → X ↑ (cheaper for foreigners) → Z ↓ (imports more expensive) → current account improves<\/span><\/div>\n    <div class=\"chip\">BOP surplus → Ms ↑. BOP deficit → Ms ↓. Automatic adjustment mechanism.<\/div>\n  <\/div>\n  <div class=\"cc\">\n    <span class=\"ch\">Ch 10<\/span>\n    <h4>Financial Crowding-Out Chain<\/h4>\n    <div class=\"row\"><span class=\"rn\">1<\/span><span>G ↑ (fiscal expansion)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">2<\/span><span>Government borrows from private sector<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">3<\/span><span>Demand for money ↑ → i ↑<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">4<\/span><span>Private investment I ↓ (crowded out)<\/span><\/div>\n    <div class=\"row\"><span class=\"rn\">5<\/span><span>Multiplier effect partially offset<\/span><\/div>\n  <\/div>\n<\/div>"};
/* ===== MODULE REGISTRY =====
To add a module, push one object into MODULES:
 { id, code, name, sub, accent,
   chapters:[{n,k,t,short,test,sum,S:[[heading,...items]],Q:[[q,a]]}],  // "Chapters" tab
   cheat:{ [n]: 'html cards' },   // "Cheat sheet" tab
   tp:[{t:'s'|'i'|'n'|'sp',c:n,x:text}],  // "Teleprompter" tab
   cards:[{u:n,q,a,n}],           // "Cards" tab
   quiz:[{q,o:[..],a:index,e}] }  // "Quiz" tab
Leave out any key and that tab hides itself. Progress is saved per module id. */
const MODULES=[{id:'mne7xb1',code:'MNE7XB1',name:'Management Economics',sub:'UJ School of Economics · Semester 2, 2026',accent:'#7eb3ff',chapters:CP,cheat:CHEAT,tp:TP_S,cards:CARDS,quiz:QUIZ}];
let MOD=MODULES[0],TAB='chapters';
const $=id=>document.getElementById(id);
function chOf(n){return MOD.chapters.find(c=>c.n===n)||{k:MOD.accent,short:'Chapter '+n}}
function chColorOf(n){return chOf(n).k}
function chShort(n){return 'Ch '+n+' · '+chOf(n).short}
function tabsAvail(){const a=[];if(MOD.chapters)a.push('chapters');if(MOD.cheat)a.push('cheat');if(MOD.tp)a.push('tp');if(MOD.cards)a.push('flash');if(MOD.quiz)a.push('quiz');return a}
function setHash(){try{history.replaceState(null,'','#/'+MOD.id+'/'+TAB)}catch(e){}}

/* module switcher */
function swProgress(m){try{let v=localStorage.getItem('sh:'+m.id+':done');if(v===null&&m.id==='mne7xb1')v=localStorage.getItem('mne-cp-done');return JSON.parse(v||'[]').length}catch(e){return 0}}
function swRender(){
  $('swCode').textContent=MOD.code;$('swName').textContent=MOD.name;
  $('swMenu').innerHTML='<div class="sw-h">Your modules</div>'+MODULES.map(m=>`<button class="sw-i" role="menuitem" style="--m:${m.accent}" aria-current="${m===MOD}" onclick="swPick('${m.id}')"><b>${m.code}</b><span>${m.name}</span><small>${m.sub} · ${swProgress(m)} of ${m.chapters?m.chapters.length:0} chapters complete</small></button>`).join('');
}
function swClose(){const m=$('swMenu');if(m.hidden)return;m.hidden=true;$('swBtn').setAttribute('aria-expanded','false')}
function swToggle(){
  const m=$('swMenu'),b=$('swBtn');
  if(!m.hidden){swClose();return}
  swRender();m.hidden=false;b.setAttribute('aria-expanded','true');
  const r=b.getBoundingClientRect();m.style.top=(r.bottom+8)+'px';m.style.left=Math.max(10,Math.min(r.left,innerWidth-m.offsetWidth-10))+'px';
  const cur=m.querySelector('[aria-current=true]');if(cur)cur.focus();
}
function swPick(id){swClose();if(MODULES.find(m=>m.id===id)!==MOD)setModule(id,TAB);$('swBtn').focus()}
document.addEventListener('click',e=>{if(!e.target.closest('.sw')&&!e.target.closest('#swMenu'))swClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){swClose()}});

function setModule(id,tab){
  MOD=MODULES.find(m=>m.id===id)||MODULES[0];
  document.documentElement.style.setProperty('--acc',MOD.accent);
  document.title=MOD.code+' · Study Hub';
  try{localStorage.setItem('sh:last',MOD.id)}catch(e){}
  /* reset every per-module view */
  if(typeof stopTP==='function')stopTP();
  tpManIdx=0;$('tpC').innerHTML='';
  $('cpArt').innerHTML='';$('chtArt').dataset.m='';
  $('fcPills').innerHTML=MOD.cards?`<button class="fcb on" data-f="ALL" onclick="fcFlt('ALL',this)">All</button>`+MOD.chapters.filter(c=>MOD.cards.some(x=>x.u===c.n)).map(c=>`<button class="fcb" data-f="${c.n}" onclick="fcFlt(${c.n},this)">Ch ${c.n}</button>`).join(''):'';
  const av=tabsAvail();
  document.querySelectorAll('.nb').forEach(b=>b.hidden=!av.includes(b.dataset.tab));
  swRender();
  go(av.includes(tab)?tab:av[0]);
}
function qMeta(){const n=MOD.quiz.length;$('qSub').textContent=n+(n===1?' question':' questions')+' · '+MOD.chapters.length+(MOD.chapters.length===1?' chapter':' chapters')+' · Shuffled · Instant feedback';$('qOut').textContent='out of '+n+' correct'}

/* cheat sheet with chapter sidebar */
let chtSel=null,chtQ='';
function chtList(){return MOD.chapters.filter(c=>MOD.cheat&&MOD.cheat[c.n])}
function chtInit(){if($('chtArt').dataset.m!==MOD.id){$('chtArt').dataset.m=MOD.id;chtSel=chtList()[0].n;chtQ='';$('chtQ').value='';chtRender(false)}}
function chtPick(n){chtSel=n;chtQ='';$('chtQ').value='';chtRender(true)}
function chtFind(v){chtQ=v.trim().toLowerCase();chtRender(false)}
function chtRender(scroll){
  const L=chtList(),all=chtSel==='ALL'||!!chtQ,cur=all?null:L.find(c=>c.n===chtSel),A=$('chtArt');
  $('chtRoot').style.setProperty('--k',cur?cur.k:MOD.accent);
  $('chtSide').innerHTML=`<h2>Cram sheet</h2><div class="cp-count">${L.length} chapters</div><button class="cp-li" style="--k:${MOD.accent}" aria-current="${all}" onclick="chtSel='ALL';chtQ='';$('chtQ').value='';chtRender(true)"><span class="cp-dot">≡</span>All chapters</button>`+L.map(c=>`<button class="cp-li" style="--k:${c.k}" aria-current="${!all&&c.n===chtSel}" onclick="chtPick(${c.n})"><span class="cp-dot">${c.n}</span>${c.t}</button>`).join('');
  const wrap=c=>`<div class="cht-ch" style="--k:${c.k}">${MOD.cheat[c.n]}</div>`;
  if(all){A.className='cp-art wide';A.innerHTML=`<div class="cp-meta">${MOD.code} · ${MOD.name}</div><h1 class="cp-h1">Cram sheet</h1><p class="cht-n" id="chtN"></p>`+L.map(wrap).join('')+'<div class="cht-empty" id="chtE" hidden>No cards match. Try a shorter word, such as “multiplier” or “repo”.</div>'}
  else{const i=L.indexOf(cur);A.className='cp-art wide cht-single';A.innerHTML=`<div class="cp-meta">Chapter ${cur.n}</div><h1 class="cp-h1">${cur.t}</h1>`+wrap(cur)+`<div class="cp-nav"><button class="cp-b" ${i===0?'disabled':''} onclick="chtPick(${i?L[i-1].n:0})">← Previous</button><button class="cp-b" ${i===L.length-1?'disabled':''} onclick="chtPick(${i<L.length-1?L[i+1].n:0})">Next →</button></div>`}
  if(chtQ){let hits=0;A.querySelectorAll('.cht-ch').forEach(w=>{let any=0;w.querySelectorAll('.cc,.bf').forEach(x=>{const m=x.textContent.toLowerCase().includes(chtQ);x.hidden=!m;if(m){any++;hits++}});w.querySelectorAll('.cram-grid').forEach(g=>g.hidden=![...g.children].some(x=>!x.hidden));w.hidden=!any});$('chtN').textContent=hits+(hits===1?' matching card':' matching cards')+' for “'+chtQ+'”';$('chtE').hidden=hits>0}
  if(scroll)window.scrollTo(0,0);
}

function boot(){
  let id=null,tab=null;
  try{const m=(location.hash||'').match(/^#\/([^/]+)\/?([^/]*)/);if(m){id=m[1];tab=m[2]}}catch(e){}
  if(!id){try{id=localStorage.getItem('sh:last')}catch(e){}}
  setModule(id,tab||'chapters');
}
boot();
</script>
</body>
</html>
