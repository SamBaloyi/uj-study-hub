<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STR7XB1 — Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--mid:#10101a;--card:#161622;--border:#22223a;--text:#e6e6f2;--muted:#66668a;--c2:#5b8dee;--c3:#0ea880;--c5:#9b6dff;--c6:#e8a020;--c8:#e05a5a;--c9:#38bdf8;--c10:#f472b6;--acc:#7eb3ff;--green:#7effd8;--warn:#ff7575;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.55;}
nav{position:sticky;top:0;z-index:50;background:rgba(8,8,16,0.97);border-bottom:1px solid var(--border);height:50px;padding:0 14px;display:flex;align-items:center;gap:4px;overflow-x:auto;}
nav::-webkit-scrollbar{display:none;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;color:var(--acc);letter-spacing:2px;margin-right:14px;flex-shrink:0;}
.nb{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:700;padding:0 9px;height:50px;cursor:pointer;white-space:nowrap;flex-shrink:0;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:0.5px;transition:color 0.15s;}
.nb:hover{color:var(--text);}
.nb.active{color:#fff;border-bottom-color:var(--acc);}
.sec{display:none;}.sec.active{display:block;}
.wrap{max-width:980px;margin:0 auto;padding:30px 16px 80px;}
.pg-head{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:2px;margin-bottom:4px;}
.pg-sub{font-size:0.72rem;color:var(--muted);margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.ch-label{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border);}

.cram-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px;margin-bottom:12px;}
.cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px;}
.ch{font-size:0.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:8px;}
.cc h4{font-size:0.82rem;font-weight:700;margin-bottom:6px;color:#fff;}
.row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.78rem;line-height:1.4;}
.row:last-of-type{border:none;}
.rn{font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;color:var(--acc);min-width:16px;padding-top:2px;flex-shrink:0;}
.chip{margin-top:7px;font-size:0.68rem;color:var(--muted);background:rgba(255,255,255,0.04);border-radius:5px;padding:5px 9px;line-height:1.4;}
.bf{background:var(--mid);border:1px solid var(--border);border-radius:9px;padding:14px 18px;margin:14px 0;}
.bf-l{font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.bff{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--green);line-height:2.1;}
.bff .dim{color:var(--muted);}
.bff .hi{color:#fff;font-weight:600;}

/* TELEPROMPTER */
.tp-bar{position:sticky;top:50px;z-index:40;background:rgba(8,8,16,0.97);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.tp-mw{display:flex;gap:2px;background:var(--mid);border:1px solid var(--border);border-radius:6px;padding:3px;}
.tpm{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:700;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all 0.15s;}
.tpm.active{background:var(--c3);color:#080810;}
.tpc{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.68rem;padding:5px 9px;border-radius:6px;cursor:pointer;}
.tpp{background:var(--c3);border:none;color:#080810;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:700;padding:6px 15px;border-radius:7px;cursor:pointer;}
.tp-prog{height:3px;background:var(--border);}
.tp-pf{height:100%;background:var(--c3);width:0%;transition:width 0.3s;}
.tp-content{max-width:780px;margin:0 auto;padding:44px 18px 120px;}
.tl{line-height:1.9;margin-bottom:2px;font-size:18px;}
.tl.ts{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:0.78em!important;margin-top:28px;margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid var(--border);}
.tl.ti{color:var(--text);padding-left:14px;}
.tl.tn{color:var(--muted);font-size:0.85em!important;padding-left:14px;font-style:italic;}
.tl.tsp{margin-bottom:14px;}
.tl.ta{color:#fff!important;text-shadow:0 0 16px rgba(14,168,128,0.5);}
.tl.tp{opacity:0.2;}
.tl.tf{opacity:0.6;}
.mn{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,16,0.97);border-top:1px solid var(--border);padding:10px 20px;align-items:center;justify-content:center;gap:12px;}

/* FLASHCARDS */
.fc-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fcb{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.fcb:hover,.fcb.on{background:var(--c2);border-color:var(--c2);color:#fff;}
.fcb.go{background:var(--c3);border-color:var(--c3);color:#080810;}
.fc-prog{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--muted);margin-left:auto;}
.fc-stage{perspective:1000px;min-height:220px;cursor:pointer;margin-bottom:12px;max-width:700px;}
.fc-inner{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform 0.4s ease;}
.fc-inner.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px;padding:24px;display:flex;flex-direction:column;justify-content:center;}
.fc-front{background:var(--card);border:1px solid var(--border);}
.fc-back{background:rgba(14,168,128,0.07);border:1px solid var(--c3);transform:rotateY(180deg);}
.fc-hint{font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px;}
.fc-cat{font-family:'JetBrains Mono',monospace;font-size:0.6rem;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:8px;}
.fc-q{font-size:0.95rem;font-weight:600;line-height:1.4;}
.fc-a{font-family:'JetBrains Mono',monospace;font-size:0.73rem;line-height:1.8;color:var(--green);}
.fc-sub{font-size:0.68rem;color:rgba(255,255,255,0.38);margin-top:8px;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}

/* QUIZ */
.qw{max-width:660px;}
.qpb{height:3px;background:var(--border);border-radius:2px;margin-bottom:18px;}
.qpf{height:100%;background:var(--c2);border-radius:2px;transition:width 0.3s;}
.qm{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--muted);margin-bottom:7px;}
.qq{font-size:0.9rem;font-weight:600;line-height:1.45;margin-bottom:14px;}
.qop{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.qo{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:0.8rem;line-height:1.4;transition:all 0.12s;text-align:left;color:var(--text);font-family:'DM Sans',sans-serif;}
.qo:hover:not(:disabled){border-color:var(--c2);background:rgba(91,141,238,0.08);}
.qo.correct{border-color:var(--c3);background:rgba(14,168,128,0.1);color:#7effd8;}
.qo.wrong{border-color:var(--warn);background:rgba(255,117,117,0.08);color:#ffaaaa;}
.qfb{font-size:0.78rem;line-height:1.6;background:var(--mid);border:1px solid var(--border);border-radius:7px;padding:10px 13px;display:none;}
.qfb.show{display:block;}
.qsc{text-align:center;padding:44px 20px;}
.qsc-n{font-family:'Bebas Neue',sans-serif;font-size:4.8rem;color:var(--c2);line-height:1;}
.qsc-l{color:var(--muted);margin-bottom:16px;font-size:0.82rem;}
.qsc-m{font-size:0.95rem;font-weight:600;margin-bottom:18px;}
/* CHAPTERS */
.cp-prog{position:sticky;top:50px;z-index:45;height:3px;background:var(--border)}
.cp-prog i{display:block;height:100%;width:0;background:var(--ac,var(--acc));transition:width .25s}
.cp{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1160px;margin:0 auto}
.cp-side{position:sticky;top:53px;align-self:start;max-height:calc(100vh - 53px);overflow:auto;padding:20px 12px;border-right:1px solid var(--border)}
.cp-side h2{font:400 1.05rem 'Bebas Neue',sans-serif;letter-spacing:2px;color:var(--muted);margin:0 10px 4px}
.cp-count{font-size:.72rem;color:var(--muted);margin:0 10px 14px}
.cp-li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;font:500 .82rem/1.3 'DM Sans',sans-serif}
.cp-li:hover{color:var(--text);background:rgba(255,255,255,.03)}
.cp-li[aria-current=true]{background:var(--card);color:#fff;box-shadow:inset 3px 0 0 var(--k)}
.cp-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--k);flex:none;display:grid;place-items:center;font-size:.62rem;font-weight:700;color:var(--k)}
.cp-li.done .cp-dot{background:var(--k);color:#080810}
.cp-main{padding:30px 22px 100px;min-width:0}
.cp-art{max-width:720px;margin:0 auto}
.cp-meta{font-size:.78rem;color:var(--k);font-weight:700;margin-bottom:6px}
.cp-h1{font:400 2.6rem/1.05 'Bebas Neue',sans-serif;letter-spacing:1.5px;margin-bottom:14px}
.cp-sum{background:var(--mid);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:.92rem;line-height:1.6}
.cp-sum b{color:#fff}
.cp-jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cp-jump a{font-size:.74rem;color:var(--text);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:4px 11px}
.cp-jump a:hover{border-color:var(--k);color:#fff}
.cp-art h3{font-size:1.15rem;font-weight:700;color:#fff;margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--border);scroll-margin-top:110px}
.cp-art p{font-size:15px;line-height:1.72;color:#d3d3e4;margin:0 0 12px}
.cp-art ul{margin:0 0 12px 20px;font-size:15px;line-height:1.7;color:#d3d3e4}
.cp-art li{margin-bottom:5px}
.cp-art strong{color:#fff}
.cp-co{border-left:3px solid var(--k);border-radius:0 9px 9px 0;padding:12px 15px;margin:16px 0;background:var(--mid);font-size:.9rem;line-height:1.65;color:#d3d3e4}
.cp-co>b{display:block;font-size:.82rem;color:#fff;margin-bottom:4px}
.cp-co.tip{border-color:var(--green)}.cp-co.warn{border-color:var(--warn)}
.cp-f{font:600 .83rem/1.9 'JetBrains Mono',monospace;color:var(--green);background:#0b0b14;border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin:14px 0;overflow-x:auto;white-space:pre}
.cp-tw{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:9px}
.cp-tw table{border-collapse:collapse;width:100%;min-width:480px;font-size:.84rem}
.cp-tw th{text-align:left;background:var(--card);color:#fff;padding:9px 12px;font-weight:700}
.cp-tw td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top;color:#d3d3e4;line-height:1.5}
.cp-q{border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:var(--card)}
.cp-q summary{cursor:pointer;padding:11px 14px;font-size:.9rem;font-weight:500;list-style:none}
.cp-q summary::-webkit-details-marker{display:none}
.cp-q summary::before{content:'+';color:var(--k);font-weight:700;margin-right:10px}
.cp-q[open] summary::before{content:'\2212'}
.cp-q div{padding:0 14px 13px 34px;font-size:.88rem;line-height:1.6;color:var(--green)}
.cp-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap}
.cp-b{background:var(--card);border:1px solid var(--border);color:var(--text);font:500 .84rem 'DM Sans',sans-serif;padding:10px 16px;border-radius:8px;cursor:pointer}
.cp-b:hover:not(:disabled){border-color:var(--k)}
.cp-b:disabled{opacity:.35;cursor:default}
.cp-b.main{background:var(--k);border-color:var(--k);color:#080810;font-weight:700}
.cp-b.main.on{background:none;color:var(--k)}
.cp button:focus-visible,.cp a:focus-visible,.cp summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:860px){
.cp{display:block}
.cp-side{position:sticky;top:53px;z-index:44;max-height:none;border:0;border-bottom:1px solid var(--border);padding:8px 10px;background:rgba(8,8,16,.97);display:flex;gap:6px;overflow-x:auto}
.cp-side h2,.cp-count{display:none}
.cp-li{width:auto;white-space:nowrap;border:1px solid var(--border);padding:7px 12px}
.cp-li[aria-current=true]{box-shadow:none;border-color:var(--k)}
.cp-h1{font-size:2.1rem}
.cp-main{padding:22px 14px 90px}
}
@media(prefers-reduced-motion:reduce){.cp-prog i{transition:none}html{scroll-behavior:auto}}
/* SHELL: modules, cheat sidebar */
[hidden]{display:none!important}
.ch-label{color:var(--k,var(--acc))}
.ch{background:color-mix(in srgb,var(--k,var(--acc)) 15%,transparent);color:var(--k,var(--acc))}
.sw{flex:none;margin-right:10px}
.sw-b{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font:600 .78rem 'DM Sans',sans-serif;cursor:pointer}
.sw-b:hover,.sw-b[aria-expanded=true]{border-color:var(--acc)}
.sw-c{color:var(--acc);font-family:'JetBrains Mono',monospace;font-size:.74rem}
.sw-n{color:var(--muted);font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-m{position:fixed;z-index:80;width:min(340px,calc(100vw - 20px));background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.sw-h{font-size:.72rem;color:var(--muted);padding:8px 10px 4px}
.sw-i{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;cursor:pointer;color:var(--text);font-family:'DM Sans',sans-serif}
.sw-i:hover,.sw-i:focus-visible{background:rgba(255,255,255,.05);outline:none}
.sw-i[aria-current=true]{background:var(--mid);box-shadow:inset 3px 0 0 var(--m)}
.sw-i b{font:600 .8rem 'JetBrains Mono',monospace;color:var(--m)}
.sw-i span{display:block;font-size:.84rem;margin-top:2px}
.sw-i small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.cht-bar{max-width:900px;margin:0 auto 18px}
.cht-bar input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font:400 .9rem 'DM Sans',sans-serif;padding:11px 14px}
.cht-bar input:focus-visible{outline:2px solid var(--k,var(--acc));outline-offset:1px}
.cp-art.wide{max-width:900px}
.cht-single .ch-label{display:none}
.cht-n{font-size:.8rem;color:var(--muted);margin:0 0 6px!important}
.cht-empty{padding:30px 0;color:var(--muted);font-size:.9rem}
@media(max-width:700px){.brand{display:none}.sw-n{display:none}}
</style>
</head>
<body>
<nav aria-label="Study sections">
  <div class="brand">STUDY HUB</div>
  <div class="sw"><button class="sw-b" id="swBtn" aria-haspopup="true" aria-expanded="false" aria-controls="swMenu" onclick="swToggle()"><span class="sw-c" id="swCode"></span><span class="sw-n" id="swName"></span><span aria-hidden="true">▾</span></button><div class="sw-m" id="swMenu" role="menu" hidden></div></div>
  <button class="nb" data-tab="chapters" onclick="go('chapters',this)">📖 Chapters</button>
  <button class="nb" data-tab="cheat" onclick="go('cheat',this)">📋 Cheat Sheet</button>
  <button class="nb" data-tab="tp" onclick="go('tp',this)">📺 Teleprompter</button>
  <button class="nb" data-tab="flash" onclick="go('flash',this)">🃏 Cards</button>
  <button class="nb" data-tab="quiz" onclick="go('quiz',this)">✅ Quiz</button>
</nav>

<!-- CHEAT SHEET -->
<section class="sec" id="chapters"><div class="cp-prog"><i id="cpBar"></i></div><div class="cp" id="cpRoot"><aside class="cp-side" id="cpSide" aria-label="Chapters"></aside><main class="cp-main"><article class="cp-art" id="cpArt"></article></main></div></section>
<section class="sec" id="cheat"><div class="cp" id="chtRoot"><aside class="cp-side" id="chtSide" aria-label="Cheat sheet chapters"></aside><main class="cp-main"><div class="cht-bar"><input type="search" id="chtQ" placeholder="Search the cram sheet (e.g. King, mission, VUCA)" aria-label="Search the cram sheet" oninput="chtFind(this.value)"></div><article class="cp-art wide" id="chtArt"></article></main></div></section>

<!-- TELEPROMPTER -->
<section class="sec" id="tp">
  <div class="tp-bar">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--c3);letter-spacing:2px;flex-shrink:0">📺 TELEPROMPTER</div>
    <div class="tp-mw">
      <button class="tpm active" id="tpMA" onclick="tpMode('auto')">⏩ Auto</button>
      <button class="tpm" id="tpMM" onclick="tpMode('manual')">👆 Manual</button>
    </div>
    <div id="tpSR" style="display:flex;align-items:center;gap:5px;flex-shrink:0">
      <span style="font-size:0.63rem;color:var(--muted)">Speed</span>
      <input type="range" id="tpSpd" min="15" max="180" value="65" style="width:62px;accent-color:var(--c3)" oninput="tpUpS()">
      <span id="tpSL" style="font-size:0.63rem;color:var(--muted);min-width:20px">65</span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
      <button class="tpc" onclick="tpFnt(-2)">A-</button>
      <span id="tpFL" style="font-size:0.63rem;color:var(--muted);min-width:22px;text-align:center">18</span>
      <button class="tpc" onclick="tpFnt(2)">A+</button>
    </div>
    <button class="tpp" id="tpPB" onclick="tpToggle()">▶ Play</button>
    <button class="tpc" onclick="tpReset()" style="margin-left:auto">↩ Reset</button>
    <span id="tpPct" style="font-size:0.63rem;color:var(--muted);flex-shrink:0">0%</span>
  </div>
  <div class="tp-prog"><div class="tp-pf" id="tpPF"></div></div>
  <div class="tp-content" id="tpC" onclick="tpManAdv()"></div>
  <div class="mn" id="tpMN">
    <button class="tpp" style="background:var(--card)" onclick="tpManPrev()">← Prev</button>
    <span id="tpMP" style="font-size:0.68rem;color:var(--muted)">Line 1</span>
    <button class="tpp" onclick="tpManNext()">Next →</button>
  </div>
</section>

<!-- FLASHCARDS -->
<section class="sec" id="flash">
<div class="wrap">
  <div class="pg-head">Flashcards</div>
  <div class="pg-sub">Tap to flip. Filter by chapter.</div>
  <div class="pill-row">
    <button class="fcb go" onclick="fcShuf()">🔀 Shuffle</button>
    <button class="fcb" onclick="fcPrev()">← Prev</button>
    <button class="fcb" onclick="fcNext()">Next →</button>
    <span id="fcPills" style="display:contents"></span>
    <div class="fc-prog" id="fcP">1 / 35</div>
  </div>
  <div class="fc-stage" onclick="fcFlip()">
    <div class="fc-inner" id="fcI">
      <div class="fc-face fc-front">
        <div class="fc-hint">tap to flip</div>
        <div id="fcCat" class="fc-cat"></div>
        <div class="fc-q" id="fcQ"></div>
      </div>
      <div class="fc-face fc-back">
        <div class="fc-hint" style="color:rgba(255,255,255,0.32)">answer</div>
        <div class="fc-a" id="fcA"></div>
        <div class="fc-sub" id="fcN"></div>
      </div>
    </div>
  </div>
</div>
</section>

<!-- QUIZ -->
<section class="sec" id="quiz">
<div class="wrap">
  <div class="pg-head">Quiz</div>
  <div class="pg-sub" id="qSub"></div>
  <div id="qC" class="qw">
    <div class="qpb"><div class="qpf" id="qPF"></div></div>

let tpMode_='auto',tpRunning=false,tpManIdx=0,tpFntSz=18,tpInterval=null,tpLines=[];

function initTP(){
  if(document.getElementById('tpC').children.length>0)return;
  const c=document.getElementById('tpC');
  tpLines=[];
  MOD.tp.forEach(l=>{
    const el=document.createElement('div');el.className='tl';
    if(l.t==='s'){el.classList.add('ts');el.style.color=chColorOf(l.c);el.textContent=l.x;}
    else if(l.t==='i'){el.classList.add('ti');el.textContent=l.x;}
    else if(l.t==='n'){el.classList.add('tn');el.textContent='↳ '+l.x;}
    else{el.classList.add('tsp');el.innerHTML='&nbsp;';}
    el.style.fontSize=tpFntSz+'px';
    c.appendChild(el);tpLines.push(el);
  });
  applyTS();
}
function applyTS(){
  tpLines.forEach((el,i)=>{el.classList.remove('ta','tp','tf');if(i<tpManIdx)el.classList.add('tp');else if(i===tpManIdx)el.classList.add('ta');else el.classList.add('tf');});
  updTP();
}
function tpMode(m){
  tpMode_=m;stopTP();
  document.getElementById('tpMA').classList.toggle('active',m==='auto');
  document.getElementById('tpMM').classList.toggle('active',m==='manual');
  document.getElementById('tpSR').style.visibility=m==='auto'?'visible':'hidden';
  const mn=document.getElementById('tpMN');mn.style.display=m==='manual'?'flex':'none';
  document.getElementById('tpPB').textContent=m==='auto'?'▶ Play':'↑ Top';
  if(m==='manual'){tpManIdx=0;applyTS();scToAct();}
}
function tpToggle(){tpMode_==='manual'?tpReset():(tpRunning?stopTP():startTP());}
function startTP(){
  tpRunning=true;document.getElementById('tpPB').textContent='⏸ Pause';
  const ppf=parseInt(document.getElementById('tpSpd').value)/60;
  tpInterval=setInterval(()=>{window.scrollBy(0,ppf);if(window.scrollY>=document.documentElement.scrollHeight-window.innerHeight-2)stopTP();updTP();},16);
}
function stopTP(){tpRunning=false;clearInterval(tpInterval);document.getElementById('tpPB').textContent=tpMode_==='auto'?'▶ Play':'↑ Top';}
function tpReset(){stopTP();tpManIdx=0;applyTS();window.scrollTo({top:50,behavior:'smooth'});updTP();}
function tpUpS(){const v=document.getElementById('tpSpd').value;document.getElementById('tpSL').textContent=v;if(tpRunning){stopTP();startTP();}}
function updTP(){const dH=document.documentElement.scrollHeight-window.innerHeight;const pct=tpMode_==='auto'?Math.round((window.scrollY/Math.max(dH,1))*100):Math.round((tpManIdx/Math.max(tpLines.length-1,1))*100);document.getElementById('tpPF').style.width=pct+'%';document.getElementById('tpPct').textContent=pct+'%';}
function tpManAdv(){if(tpMode_==='manual')tpManNext();}
function tpManNext(){if(tpManIdx<tpLines.length-1){tpManIdx++;applyTS();scToAct();document.getElementById('tpMP').textContent=`Line ${tpManIdx+1}/${tpLines.length}`;}}
function tpManPrev(){if(tpManIdx>0){tpManIdx--;applyTS();scToAct();}}
function scToAct(){const el=tpLines[tpManIdx];if(!el)return;const r=el.getBoundingClientRect();window.scrollBy({top:r.top-window.innerHeight/2,behavior:'smooth'});}
function tpFnt(d){tpFntSz=Math.max(13,Math.min(48,tpFntSz+d));document.getElementById('tpFL').textContent=tpFntSz;tpLines.forEach(el=>el.style.fontSize=tpFntSz+'px');}
document.addEventListener('keydown',e=>{if(!document.getElementById('tp').classList.contains('active'))return;if(e.key===' '){e.preventDefault();tpToggle();}if(e.key==='ArrowRight'||e.key==='ArrowDown')tpManNext();if(e.key==='ArrowLeft'||e.key==='ArrowUp')tpManPrev();});

function initQuiz(){qMeta();qShuffled=[...MOD.quiz].sort(()=>Math.random()-0.5);qIdx=0;qScore=0;document.getElementById('qC').style.display='block';document.getElementById('qSc').style.display='none';renderQ();}
function renderQ(){
  qAnswered=false;const q=qShuffled[qIdx];
  document.getElementById('qM').textContent=`Question ${qIdx+1} of ${qShuffled.length}`;
  document.getElementById('qPF').style.width=`${(qIdx/qShuffled.length)*100}%`;
  document.getElementById('qQ').textContent=q.q;
  document.getElementById('qNW').style.display='none';
  const fb=document.getElementById('qFB');fb.classList.remove('show');fb.textContent='';
  const opts=document.getElementById('qO');opts.innerHTML='';

}
function selQ(chosen,correct,exp){
  if(qAnswered)return;qAnswered=true;
  document.querySelectorAll('.qo').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');if(i===chosen&&chosen!==correct)b.classList.add('wrong');});
  if(chosen===correct)qScore++;
  const fb=document.getElementById('qFB');fb.textContent=(chosen===correct?'✅ Correct. ':'❌ Not quite. ')+exp;fb.classList.add('show');

}

rategic analysis"]]]], ["The strategic management process (and the textbook map)", ["tbl", ["Phase", "What it is", "Chapters"], [["Strategic management", "Planning, implementing and evaluating strategies to achieve long-term goals", "1"], ["Organisational direction and governance", "Vision, mission, values, strategic objectives", "2 & 3"], ["Environmental analysis", "Internal and external environment (SWOT)", "4 & 5"], ["Strategic formulation", "Strategies that align capabilities with environmental opportunities and challenges", "6 & 7"], ["Business model and strategic implementation", "Resource allocation, leadership, structure, operational plans", "8 & 11"], ["Continuous strategic management cycle", "Ongoing planning, implementing, reviewing and adapting", "14"]]]], ["Benefits and risks", ["tbl", ["Functional aspects (benefits)", "Dysfunctional aspects (risks)"], [["Higher profitability", "Time"], ["Higher productivity", "Unrealistic expectations from managers and employees"], ["Improved communication across functions", "The uncertain chain of implementation"], ["Employee empowerment", "Negative perception of strategic management"], ["Discipline and a sense of responsibility", "No specific objectives or measurable outcomes"], ["More effective time management", "Culture of change"], ["More effective resource management", "Success groove"], ["Framework for change management", ""]]]], ["Strategic issues and concepts leading into the future", ["ul", ["Ethics and strategy", "Shareholder management", "Innovation economy and knowledge management: knowledge management, innovation management, knowledge innovation, multiculturalism in SA organisations and knowledge management, corporate entrepreneurship", "Change management: themes of change (Table 1.4)", "Strategic leadership"]], ["ex", "Cohesion case study", "Shoprite Checkers is the textbook's cohesion case (pp. 29–48). Outcome 2.10: analyse Shoprite using strategic management principles."]]], "Q": [["Define strategy.", ential to the structural fibre of an organisation", "Prioritising core values is important; winning organisations show <strong>consistency</strong>", "Shared core values help everyone act consistently according to predetermined guidelines", "The core value statement forms the basis of every activity", "Examples: honesty, integrity, openness, transparency"]], ["ex", "Vision vs mission vs intent", "Mission and vision are different concepts. Strategic intent contains elements of both, and a vision or mission statement can articulate the strategic intent."], ["tip", "Whatever an organisation uses to set direction, it should be unique, reflect the culture and be implementable. Case studies: Vodacom, Woolworths, Shoprite Checkers."]]], "Q": [["Define strategic leadership.", "The ability of a leader or leadership team to anticipate, envision, maintain flexibility and empower others to create strategic change that enhances performance and ensures long-term sustainability (Hitt, Ireland &amp; Hoskisson, 2017)."], ["Distinguish between the great leader and great groups views.", "Great leader: CEO as a “Lone Ranger”, isolated, top-down; it suited stable environments. Great groups: organisation as a community, leadership distributed among diverse individuals, collaboration, still with a top management team."], ["Identify the key components of strategic leadership.", "Purpose/vision; core capabilities; human capital; effective culture; ethical practices; balanced controls; change orientation."], ["Describe the six leadership tasks (Abell, 2006).", "Dual nature of strategy; start with vision, mission and distinctive profile; replace resource-based strategy; align external and internal worlds; compete through business systems; recognise decentralised strategy-making."], ["Vision vs mission: which question does each answer?", "Vision: “What do we want to become in the future?” Mission: “What is our business?”"], ["Guide exercises", "Develop a vision or mission for a company of your choice; evaluate Telkom's vision statement against the general requirements; identify and evaluate UJ's values. (No model answers in the slides.)"]]}, {"n": 3, "short": "Governance", "k": "#e07a5f", "t": "Corporate governance and strategy", "test": "", "sum": "<b>Corporate governance</b> is the system of rules, practices and processes by which a company is directed, managed and controlled, balancing the interests of all stakeholders. In SA the definitive authority is the <b>King Report</b>.", "S": [["Definition and key elements", ["ex", "Definition", "<strong>Corporate governance</strong>: the system of rules, practices and processes by which a company is directed, managed and controlled to ensure accountability, fairness and transparency. It balances the interests of shareholders, management, customers, suppliers, financiers, government and the community."], "Organisations cannot focus solely on economic gain; they must consider the well-being of all stakeholders.", ["tbl", ["Element", "Role"], [["Board of directors", "Oversees strategy, performance and risk management"], ["Senior management", "Implements decisions, runs daily operations"], ["Shareholders and stakeholders", "Provide capital, have interests in success"], ["Accountability, transparency and disclosure", "Open reporting of financial and operational information"], ["Accountability and compliance", "Adherence to laws, regulations and ethical standards"]]]], ["Responsible leadership, CSR and sustainability", ["ul", ["Organisations must embrace responsible leadership: corporate financial prosperity vs ESG (Ecological, Social, Governance); purpose over profit.", "They must take ownership of the economic, social and environmental consequences of their decisions and actions."]], ["tbl", ["Corporate social responsibility (CSR)", "Corporate sustainability"], [["Related concepts: corporate citizenship, social accountability", "Measured by the triple bottom line: economic, social, environmental impact"]]], "Good corporate governance benefits all stakeholders beyond shareholders and achieves a triple bottom line."], ["Agency theory vs stewardship theory", ["tbl", ["Agency theory", "Stewardship theory"], [["Managers (agents) may act in their own interest rather than shareholders' (principals)", "Managers are stewards who act responsibly for long-term success and stakeholders' benefit"], ["So governance mechanisms are needed to align interests", "Assumes they can be trusted to act in the organisation's best interest"]]], ["ex", "Example: Enron (USA, 2001)", "Lack of transparency and poor governance led to massive fraud and bankruptcy, prompting new global governance regulations."]], ["Governance in the strategic management process", ["tbl", ["Phase", "Governance role"], [["Formulation", "Setting direction on broader principles of economic, social and environmental performance"], ["Implementation", "Clarifying the role of the board and management in overseeing implementation"], ["Control and evaluation", "Clarifying the role of the audit committee in managing and overseeing implementation"]]], "Traditionally, strategic management focused on formulating the most competitive strategy. A governance focus means thinking differently about selecting the optimal strategy: ensuring accountability and transparency and upholding ethical standards."], ["Ethics and the seven signs of ethical collapse", "Corporate governance should be based on sound ethical values: accountability and responsible decision-making, transparency and trust, stakeholder rights and fair treatment, protecting customers, fair treatment of employees.", ["ul", ["1. Pressure to meet the numbers", "2. Far away and silent", "3. Sycophantic (flattering) executives and an iconic CEO", "4. A weak board", "5. Conflicts of interest", "6. Overconfidence", "7. Social responsibility as the only measure of goodness"]]], ["Corporate governance in South Africa", ["ul", ["After 1994, SA organisations faced a new political system, rapid trade liberalisation, demanding international investors, an emerging markets crisis and rapid regulatory reform.", "Legislation, regulations, listing rules and accounting standards are converging to international norms.", "Governance can be statutory, a code of principles and practices, or both. USA: Sarbanes-Oxley Act 2002 (SOX). SA and the 27 EU states chose a <strong>code of principles and practices</strong>.", "Various Acts affect governance, but the definitive authority is the <strong>King Report on Corporate Governance</strong>."]]], ["The King Reports", ["tbl", ["Report", "Key points"], [["King I (1994)", "Fundamental principles for good financial, social, ethical and environmental practice. Two dimensions: financial (responsibility to shareholders) and ethical (standards of ethics)"], ["King II (2002)", "Replaced King I; went beyond the Companies Act of 1973; Code of Corporate Practice and Conduct. Seven characteristics: discipline, transparency, independence, accountability, responsibility, fairness, social responsibility"], ["King III (released for comment 25 Feb 2009)", "Prompted by the anticipated new Companies Act and international trends. Philosophy: good governance is effective leadership; sustainability is the primary moral and economic imperative; corporate citizenship; the apartheid legacy is unsustainable (transformation and redress); requires sustainability reporting"], ["King IV (Nov 2016, IoDSA)", "Ethical leadership; integrated thinking; organisation as integral to society; corporate citizenship; stakeholder inclusivity; integrated reporting. Principles, practices and governance outcomes (Table 3.4)"], ["King V (draft proposal, 2025)", "Outcomes-based approach (ethical culture, performance, conformance, legitimacy); ethical AI and technology; opportunity-focused risk management; integrated thinking incl. SDGs; stronger “apply and explain” disclosure; proportional application"]]], ["ex", "King III key points adopted", "Risk-based approach y, responsibility, fairness, social responsibility."]]}];

  const qs=c.Q.map(q=>`<details class="cp-q"><summary>${q[0]}</summary><div>${q[1]}</div></details>`).join('');
  document.getElementById('cpArt').innerHTML=`<div class="cp-meta">Chapter ${c.n}${c.test?` · Assessed in ${c.test}`:''}</div><h1 class="cp-h1">${c.t}</h1><div class="cp-sum"><b>In short:</b> ${c.sum}</div><nav class="cp-jump" aria-label="In this chapter">${jump}</nav>${body}<h3 id="cp-q">Check yourself</h3><p>Try answering before you open each one.</p>${qs}<div class="cp-nav"><button class="cp-b" ${i===0?'disabled':''} onclick="cpRender(${i-1},true)">← Previous</button><button class="cp-b main${done?' on':''}" onclick="cpToggle()">${done?'✓ Completed (undo)':'Mark chapter complete'}</button><button class="cp-b" ${i===MOD.chapters.length-1?'disabled':''} onclick="cpRender(${i+1},true)">Next →</button></div>`;
  if(scroll)window.scrollTo(0,0);
}
function cpToggle(){const n=MOD.chapters[cpCur].n,p=cpDone.indexOf(n);p<0?cpDone.push(n):cpDone.splice(p,1);cpSave();cpRender(cpCur,false)}
function cpInit(){if(!document.getElementById('cpArt').innerHTML){cpLoad();let i=0;try{i=Math.min(+localStorage.getItem('sh:'+MOD.id+':ch')||0,MOD.chapters.length-1)}catch(e){}cpRender(i,false)}}

rategic direction = goal setting</span></div><div class=\"row\"><span class=\"rn\">4</span><span>Better strategic intelligence → better strategic leadership</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 2</span><h4>Great leader vs great groups</h4><div class=\"row\"><span class=\"rn\">1</span><span>Leader: CEO “Lone Ranger”, isolated, top-down, suited stable times</span></div><div class=\"row\"><span class=\"rn\">2</span><span>Groups: organisation as a community, distributed leadership, collaboration, still a top team</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 2</span><h4>Components of strategic leadership</h4><div class=\"row\"><span class=\"rn\">1</span><span>Purpose / vision</span></div><div class=\"row\"><span class=\"rn\">2</span><span>Core capabilities</span></div><div class=\"row\"><span class=\"rn\">3</span><span>Human capital</span></div><div class=\"row\"><span class=\"rn\">4</span><span>Effective culture</span></div><div class=\"row\"><span class=\"rn\">5</span><span>Ethical practices</span></div><div class=\"row\"><span class=\"rn\">6</span><span>Balanced controls</span></div><div class=\"row\"><span class=\"rn\">7</span><span>Change orientation</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 2</span><h4>Six leadership tasks (Abell)</h4><div class=\"row\"><span class=\"rn\">1</span><span>Dual nature (short and long term)</span></div><div class=\"row\"><span class=\"rn\">2</span><span>Start with vision, mission and profile</span></div><div class=\"row\"><span class=\"rn\">3</span><span>Replace resource-based strategy</span></div><div class=\"row\"><span class=\"rn\">4</span><span>Align external and internal worlds</span></div><div class=\"row\"><span class=\"rn\">5</span><span>Compete via business systems</span></div><div class=\"row\"><span class=\"rn\">6</span><span>Decentralised strategy-making</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 2</span><h4>Direction statements</h4><div class=\"row\"><span cla ontrol and evaluation: audit committee</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 3</span><h4>7 signs of ethical collapse</h4><div class=\"row\"><span class=\"rn\">1</span><span>Pressure to meet numbers</span></div><div class=\"row\"><span class=\"rn\">2</span><span>Far away and silent</span></div><div class=\"row\"><span class=\"rn\">3</span><span>Sycophantic execs and iconic CEO</span></div><div class=\"row\"><span class=\"rn\">4</span><span>Weak board</span></div><div class=\"row\"><span class=\"rn\">5</span><span>Conflicts of interest</span></div><div class=\"row\"><span class=\"rn\">6</span><span>Overconfidence</span></div><div class=\"row\"><span class=\"rn\">7</span><span>Social responsibility as only measure of goodness</span></div></div><div class=\"cc\"><span class=\"ch\">Ch 3</span><h4>King Reports</h4><div class=\"row\"><span class=\"rn\">1</span><span>I (1994): financial + ethical dimensions</span></div><div class=\"row\"><span class=\"rn\">2</span><span>II (2002): 7 characteristics</span></div><div class=\"row\"><span class=\"rn\">3</span><span>III (2009 comment): sustainability, risk-based, integrated reporting</span></div><div class=\"row\"><span class=\"rn\">4</span><span>IV (Nov 2016): ethical leadership, integrated thinking, stakeholder inclusivity</span></div><div class=\"row\"><span class=\"rn\">5</span><span>V (draft 2025): outcomes, ethical AI, opportunity-focused risk</span></div><div class=\"chip\">SA: code of principles · USA: SOX 2002 (statutory)</div></div><div class=\"cc\"><span class=\"ch\">Ch 3</span><h4>King II: 7 characteristics</h4><div class=\"row\"><span class=\"rn\">1</span><span>Discipline</span></div><div class=\"row\"><span class=\"rn\">2</span><span>Transparency</span></div><div class=\"row\"><span class=\"rn\">3</span><span>Independence</span></div><div class=\"row\"><span class=\"rn\">4</span><span>Accountability</span></div><div class=\"row\"><span class=\"rn\">5</span><span>Responsibility</span></div><div class=\"row\"><span class=\"rn\">6</span><span>Fairness</span></div><div class=\"row\"><span class=\"rn\">7</span><span>Social responsibility</span></div></div></div>"};
/* ===== MODULE REGISTRY =====
To add a module, push one object into MODULES:
 { id, code, name, sub, accent,
   chapters:[{n,k,t,short,test,sum,S:[[heading,...items]],Q:[[q,a]]}],  // "Chapters" tab
   cheat:{ [n]: 'html cards' },   // "Cheat sheet" tab
   tp:[{t:'s'|'i'|'n'|'sp',c:n,x:text}],  // "Teleprompter" tab
   cards:[{u:n,q,a,n}],           // "Cards" tab
   quiz:[{q,o:[..],a:index,e}] }  // "Quiz" tab
Leave out any key and that tab hides itself. Progress is saved per module id. */
const MODULES=[{id:'str7xb1',code:'STR7XB1',name:'Strategic Management 4',sub:'UJ · Chapters 1–3 · Semester 2, 2026',accent:'#d4a72c',chapters:CP,cheat:CHEAT,tp:TP_S,cards:CARDS,quiz:QUIZ}];
let MOD=MODULES[0],TAB='chapters';
const $=id=>document.getElementById(id);
function chOf(n){return MOD.chapters.find(c=>c.n===n)||{k:MOD.accent,short:'Chapter '+n}}
function chColorOf(n){return chOf(n).k}
function chShort(n){return 'Ch '+n+' · '+chOf(n).short}
function tabsAvail(){const a=[];if(MOD.chapters)a.push('chapters');if(MOD.cheat)a.push('cheat');if(MOD.tp)a.push('tp');if(MOD.cards)a.push('flash');if(MOD.quiz)a.push('quiz');return a}
function setHash(){try{history.replaceState(null,'','#/'+MOD.id+'/'+TAB)}catch(e){}}

/* module switcher */
function swProgress(m){try{let v=localStorage.getItem('sh:'+m.id+':done');if(v===null&&m.id==='mne7xb1')v=localStorage.getItem('mne-cp-done');return JSON.parse(v||'[]').length}catch(e){return 0}}
function swRender(){
  $('swCode').textContent=MOD.code;$('swName').textContent=MOD.name;
  $('swMenu').innerHTML='<div class="sw-h">Your modules</div>'+MODULES.map(m=>`<button class="sw-i" role="menuitem" style="--m:${m.accent}" aria-current="${m===MOD}" onclick="swPick('${m.id}')"><b>${m.code}</b><span>${m.name}</span><small>${m.sub} · ${swProgress(m)} of ${m.chapters?m.chapters.length:0} chapters complete</small></button>`).join('');
}
function swClose(){const m=$('swMenu');if(m.hidden)return;m.hidden=true;$('swBtn').setAttribute('aria-expanded','false')}
function swToggle(){
  const m=$('swMenu'),b=$('swBtn');
  if(!m.hidden){swClose();return}
  swRender();m.hidden=false;b.setAttribute('aria-expanded','true');
  const r=b.getBoundingClientRect();m.style.top=(r.bottom+8)+'px';m.style.left=Math.max(10,Math.min(r.left,innerWidth-m.offsetWidth-10))+'px';
  const cur=m.querySelector('[aria-current=true]');if(cur)cur.focus();
}
function swPick(id){swClose();if(MODULES.find(m=>m.id===id)!==MOD)setModule(id,TAB);$('swBtn').focus()}
document.addEventListener('click',e=>{if(!e.target.closest('.sw')&&!e.target.closest('#swMenu'))swClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){swClose()}});

function setModule(id,tab){
  MOD=MODULES.find(m=>m.id===id)||MODULES[0];
  document.documentElement.style.setProperty('--acc',MOD.accent);
  document.title=MOD.code+' · Study Hub';
  try{localStorage.setItem('sh:last',MOD.id)}catch(e){}
  /* reset every per-module view */
  if(typeof stopTP==='function')stopTP();
  tpManIdx=0;$('tpC').innerHTML='';
  $('cpArt').innerHTML='';$('chtArt').dataset.m='';
  $('fcPills').innerHTML=MOD.cards?`<button class="fcb on" data-f="ALL" onclick="fcFlt('ALL',this)">All</button>`+MOD.chapters.filter(c=>MOD.cards.some(x=>x.u===c.n)).map(c=>`<button class="fcb" data-f="${c.n}" onclick="fcFlt(${c.n},this)">Ch ${c.n}</button>`).join(''):'';
  const av=tabsAvail();

}
function qMeta(){const n=MOD.quiz.length;$('qSub').textContent=n+(n===1?' question':' questions')+' · '+MOD.chapters.length+(MOD.chapters.length===1?' chapter':' chapters')+' · Shuffled · Instant feedback';$('qOut').textContent='out of '+n+' correct'}

/* cheat sheet with chapter sidebar */
let chtSel=null,chtQ='';
function chtList(){return MOD.chapters.filter(c=>MOD.cheat&&MOD.cheat[c.n])}
function chtInit(){if($('chtArt').dataset.m!==MOD.id){$('chtArt').dataset.m=MOD.id;chtSel=chtList()[0].n;chtQ='';$('chtQ').value='';chtRender(false)}}
function chtPick(n){chtSel=n;chtQ='';$('chtQ').value='';chtRender(true)}

function chtRender(scroll){

  const wrap=c=>`<div class="cht-ch" style="--k:${c.k}">${MOD.cheat[c.n]}</div>`;
  if(all){A.className='cp-art wide';A.innerHTML=`<div class="cp-meta">${MOD.code} · ${MOD.name}</div><h1 class="cp-h1">Cram sheet</h1><p class="cht-n" id="chtN"></p>`+L.map(wrap).join('')+'<div class="cht-empty" id="chtE" hidden>No cards match. Try a shorter word, such as “King” or “vision”.</div>'}
  else{const i=L.indexOf(cur);A.className='cp-art wide cht-single';A.innerHTML=`<div class="cp-meta">Chapter ${cur.n}</div><h1 class="cp-h1">${cur.t}</h1>`+wrap(cur)+`<div class="cp-nav"><button class="cp-b" ${i===0?'disabled':''} onclick="chtPick(${i?L[i-1].n:0})">← Previous</button><button class="cp-b" ${i===L.length-1?'disabled':''} onclick="chtPick(${i<L.length-1?L[i+1].n:0})">Next →</button></div>`}
  if(chtQ){let hits=0;A.querySelectorAll('.cht-ch').forEach(w=>{let any=0;w.querySelectorAll('.cc,.bf').forEach(x=>{const m=x.textContent.toLowerCase().includes(chtQ);x.hidden=!m;if(m){any++;hits++}});w.querySelectorAll('.cram-grid').forEach(g=>g.hidden=![...g.children].some(x=>!x.hidden));w.hidden=!any});$('chtN').textContent=hits+(hits===1?' matching card':' matching cards')+' for “'+chtQ+'”';$('chtE').hidden=hits>0}
  if(scroll)window.scrollTo(0,0);
}

function boot(){
  let id=null,tab=null;
  try{const m=(location.hash||'').match(/^#\/([^/]+)\/?([^/]*)/);if(m){id=m[1];tab=m[2]}}catch(e){}
  if(!id){try{id=localStorage.getItem('sh:last')}catch(e){}}
  setModule(id,tab||'chapters');
}
boot();
